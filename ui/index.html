<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>认证接口测试台</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #192b26;
      --muted: #4c635a;
      --line: #cdd9d2;
      --accent: #20654d;
      --surface: #fff;
      background: #f3f5f2;
      color: var(--ink);
      font: 100%/1.55 system-ui, "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    ::selection { background: #d8eddd; color: var(--ink); }
    body { margin: 0; }
    main { width: min(100% - 2rem, 66rem); margin: 2.5rem auto; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1.5rem; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 1.9rem; letter-spacing: -.025em; }
    h2 { font-size: 1.1rem; }
    h3 { font-size: 1rem; }
    a { color: var(--accent); text-underline-offset: .2em; }
    .intro, .hint, small { color: var(--muted); }
    .intro { margin-top: .4rem; }
    .layout { display: grid; grid-template-columns: minmax(18rem, 1fr) minmax(0, 1fr); gap: 1.25rem; margin-top: 1.4rem; align-items: start; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: .8rem; padding: 1.1rem; min-width: 0; }
    .panel > section + section, form + form { border-top: 1px solid var(--line); margin-top: 1rem; padding-top: 1rem; }
    form { display: grid; gap: .6rem; }
    label { display: grid; gap: .2rem; font-size: .875rem; font-weight: 600; }
    input, button { font: inherit; min-height: 2.5rem; border: 1px solid #aabcb3; border-radius: .4rem; color: var(--ink); }
    input { width: 100%; padding: .4rem .6rem; caret-color: var(--accent); }
    button { background: var(--surface); padding: .4rem .7rem; cursor: pointer; }
    button:hover:not(:disabled) { background: #eaf2eb; }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button.primary:hover:not(:disabled) { background: #174b3a; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    :is(input, button, a, pre):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    form > button { justify-self: start; }
    .actions { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .6rem; }
    .hint, #status, #state { font-size: .875rem; margin-top: .55rem; }
    #state, #status[data-state="ok"] { color: var(--accent); font-weight: 650; }
    #status[data-state="error"] { color: #902f2a; }
    pre { min-height: 13rem; max-height: 28rem; overflow: auto; margin: .65rem 0 0; padding: .9rem; border-radius: .45rem; background: #182823; color: #e5efe8; font: .8125rem/1.6 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    code { font-family: ui-monospace, Consolas, monospace; }
    @media (max-width: 46rem) {
      main { margin: 1.25rem auto; }
      .layout { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>认证接口测试台</h1>
      <a href="../docs">查看 Swagger 文档</a>
    </header>
    <p class="intro">用测试账号走一遍：注册 → 登录 → 查询用户 → 刷新 → 退出。</p>
    <div class="layout">
      <div class="panel">
        <section aria-label="账号操作">
          <form id="register" method="post" action="../auth/register">
            <h2>注册 <small><code>POST /auth/register</code></small></h2>
            <label>邮箱<input name="email" type="email" autocomplete="email" maxlength="320" required></label>
            <label>用户名<input name="username" autocomplete="username" maxlength="50" required></label>
            <label>密码（至少 15 个字符）<input name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required></label>
            <button type="submit" disabled>注册账号</button>
          </form>
          <form id="login" method="post" action="../auth/login">
            <h2>登录 <small><code>POST /auth/login</code></small></h2>
            <label>邮箱<input name="email" type="email" autocomplete="username" maxlength="320" required></label>
            <label>密码<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label>
            <button type="submit" class="primary" disabled>登录并获取令牌</button>
          </form>
        </section>
        <section aria-labelledby="session-title">
          <h2 id="session-title">会话操作</h2>
          <p id="state" role="status">页面未持有令牌</p>
          <div class="actions">
            <button type="button" id="profile" disabled>查询当前用户</button>
            <button type="button" id="refresh" disabled>刷新令牌</button>
            <button type="button" id="logout" disabled>退出登录</button>
            <button type="button" id="anonymous" disabled>测试未登录请求</button>
            <button type="button" id="verify-logout" disabled>验证退出失效</button>
          </div>
          <p class="hint">退出后可验证旧令牌是否都返回 401。</p>
        </section>
      </div>
      <section class="panel" aria-labelledby="response-title">
        <h2 id="response-title">最近一次响应</h2>
        <p id="status" role="status">等待发送请求</p>
        <pre id="output" tabindex="0" aria-label="接口响应内容">这里显示 HTTP 状态码和响应内容。</pre>
        <p class="hint">令牌只存在页面内存，响应区不显示原文。刷新页面不等于退出登录。</p>
      </section>
    </div>
  </main>
</body>
</html>
